content="width=device-width, initial-scale=1.0">


<title>

</title>

content="Entre em contato com a HB TRANSPORTS para solicitar soluções logísticas.">

<header class="header">

class="logo">

<main>



<section class="page-banner">


<div class="container">


<h1>
Entre em Contato
</h1>


<p>
Solicite uma proposta personalizada.
</p>


</div>


</section>






<section>


<div class="container">



<form class="contact-form" id="contactForm">



<label for="nome">

Nome

</label>


<input 
id="nome"
type="text"
name="nome"
required>



<label for="empresa">

Empresa

</label>


<input
id="empresa"
type="text"
name="empresa"
required>



<label for="telefone">

Telefone

</label>


<input
id="telefone"
type="tel"
name="telefone"
required>



<label for="email">

E-mail

</label>


<input
id="email"
type="email"
name="email"
required>



<label for="origem">

Origem da carga

</label>


<input
id="origem"
type="text"
name="origem"
required>



<label for="destino">

Destino

</label>


<input
id="destino"
type="text"
name="destino"
required>







<label for="carga">

Tipo de carga

</label>


<input
id="carga"
type="text"
name="carga"
required>



<label for="mensagem">

Mensagem

</label>


<textarea id="mensagem" name="mensagem" required></textarea>

<div class="form-message" role="status" aria-live="polite"></div>


<button
type="submit"
class="btn-primary">

Enviar solicitação

</button>



</form>



</div>
